apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-schema
  namespace: vaccines
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: infra
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: migrate
          image: postgres:17-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres-0.postgres -U vaccines -d vaccines; do sleep 1; done
              psql -v ON_ERROR_STOP=1 -h postgres-0.postgres -U vaccines -d vaccines -f /schema/schema.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: password}
          volumeMounts:
            - {name: schema, mountPath: /schema}
      volumes:
        - name: schema
          configMap: {name: db-schema}
