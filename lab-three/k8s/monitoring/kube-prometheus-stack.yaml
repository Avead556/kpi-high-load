crds:
  enabled: true
grafana:
  enabled: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
defaultRules:
  create: false
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
coreDns: {enabled: false}

kubelet:
  enabled: true
  serviceMonitor:
    interval: 5s
    cAdvisor: true
    probes: false
    resource: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  nodeSelector: {role: infra}
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}

kube-state-metrics:
  nodeSelector: {role: infra}
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  prometheus:
    monitor:
      interval: 5s

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    scrapeInterval: 5s
    evaluationInterval: 5s
    retention: 7d
    nodeSelector: {role: infra}
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
