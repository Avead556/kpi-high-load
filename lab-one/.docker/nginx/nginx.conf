worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format upstream '$time_iso8601 $request_method $uri $status upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream buffer=64k flush=1s;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream web {
        zone web 64k;
        server web:8000 resolve;
        keepalive 128;
        keepalive_timeout 30s;
    }

    server {
        listen 80;

        location = /noop {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout;
        }
    }
}
