kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8084
        listenAddress: 127.0.0.1
      - containerPort: 30090
        hostPort: 9094
        listenAddress: 127.0.0.1
  - role: worker
  - role: worker
kubeadmConfigPatches:
  # FAIL_RATE crashes a worker every few tasks; the default crash-loop backoff (10 s doubling to 5 min) stops the
  # pool entirely (results/rejected/fail_rate_default_backoff). KubeletCrashLoopBackOffMax is beta in 1.37.
  - |
    kind: KubeletConfiguration
    crashLoopBackOff:
      maxContainerRestartPeriod: 1s
